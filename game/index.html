<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blocksworld 4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0099ff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Barra de cima vai de ponta a ponta na esquerda */
        .top-bar {
            height: 50px;
            background-color: #ffffff;
            border-bottom: 4px solid #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            width: 100%;
        }

        /* Container que segura a barra lateral e o conteúdo lado a lado */
        .container {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
            overflow: hidden;
        }

        /* Barra lateral cinza começa abaixo da barra de cima */
        .sidebar {
            width: 100px;
            background-color: #7f7f7f;
            border-right: 4px solid #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            gap: 15px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            background-color: #0099ff;
            border: 3px solid #000;
            border-radius: 50%;
            margin-bottom: 5px;
        }

        .home-btn {
            background-color: #555;
            color: #00ffff;
            padding: 8px 12px;
            border: 2px solid #000;
            font-weight: bold;
            text-decoration: none;
            font-size: 14px;
        }

        .build-btn {
            background-color: #555;
            color: #00ffff;
            padding: 8px 12px;
            border: 2px solid #000;
            font-weight: bold;
            text-decoration: none;
            font-size: 14px;
        }

        /* Área do conteúdo principal com rolagem vertical habilitada */
        .content-area {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        /* Caixa Superior (blockster whoa) */
        .banner-box {
            background-color: #ffffff;
            border: 4px solid #000;
            padding: 30px;
            font-size: 28px;
            font-weight: bold;
        }

        /* Container para alinhar os cards dos jogos lado a lado */
        .games-container {
            display: flex;
            gap: 15px;
            flex-wrap: nowrap;
        }

        /* Card do Jogo */
        .game-card {
            background-color: #0099ff;
            border: 4px solid #000;
            width: 260px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .game-thumbnail {
            background-color: #0099ff;
            height: 140px;
            border-bottom: 4px solid #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fake-blocks {
            width: 120px;
            height: 60px;
            background-color: #7f7f7f;
            border: 2px solid #555;
        }

        .game-footer {
            background-color: #ffffff;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-title {
            font-weight: bold;
            font-size: 15px;
        }

        .play-btn {
            background-color: #28a745;
            color: #ffffff;
            padding: 8px 16px;
            border: 2px solid #000;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .play-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <!-- Barra de cima (estica até a esquerda cobrindo o topo) -->
    <div class="top-bar">
        Home
    </div>

    <div class="container">
        <!-- Barra lateral cinza logo abaixo -->
        <div class="sidebar">
            <div class="avatar"></div>
            <a href="#" class="home-btn">home</a>
            <a href="build/index.html" class="build-btn">build</a>
        </div>

        <!-- Conteúdo Principal com rolagem -->
        <div class="content-area">
            <div class="banner-box">
                build mode chegoooooooooooooooooooooooooou!
            </div>

            <!-- Container onde os jogos serão injetados automaticamente via JavaScript -->
            <div class="games-container" id="gamesContainer">
                <!-- Os cards vão aparecer aqui dinamicamente -->
            </div>
        </div>
    </div>

    <script>
        // Função para carregar o database.json e criar os cards usando o ID na URL
        fetch('database.json')
            .then(response => response.json())
            .then(games => {
                const container = document.getElementById('gamesContainer');
                container.innerHTML = ''; // Limpa o container antes de preencher

                games.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'game-card';

                    // Monta o link dinamicamente usando a estrutura games/%id%/play.html
                    const playUrl = `games/${game.id}/play.html`;

                    card.innerHTML = `
                        <div class="game-thumbnail">
                            <div class="fake-blocks"></div>
                        </div>
                        <div class="game-footer">
                            <span class="game-title">${game.title}</span>
                            <a href="${playUrl}" class="play-btn">Play</a>
                        </div>
                    `;

                    container.appendChild(card);
                });
            })
            .catch(error => console.error('Erro ao carregar o database.json:', error));
    </script>

</body>
</html>
