<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blocksworld 4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0099ff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Barra de cima vai de ponta a ponta na esquerda */
        .top-bar {
            height: 50px;
            background-color: #ffffff;
            border-bottom: 4px solid #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            width: 100%;
        }

        /* Container que segura a barra lateral e o conteúdo lado a lado */
        .container {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
        }

        /* Barra lateral cinza começa abaixo da barra de cima */
        .sidebar {
            width: 100px;
            background-color: #7f7f7f;
            border-right: 4px solid #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            background-color: #0099ff;
            border: 3px solid #000;
            border-radius: 50%;
            margin-bottom: 20px;
        }

        .home-btn {
            background-color: #555;
            color: #00ffff;
            padding: 8px 12px;
            border: 2px solid #000;
            font-weight: bold;
            text-decoration: none;
            font-size: 14px;
        }

        /* Área do conteúdo principal */
        .content-area {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Caixa Superior (blockster whoa) */
        .banner-box {
            background-color: #ffffff;
            border: 4px solid #000;
            padding: 30px;
            font-size: 28px;
            font-weight: bold;
        }

        /* Card do Jogo */
        .game-card {
            background-color: #0099ff;
            border: 4px solid #000;
            width: 320px;
            display: flex;
            flex-direction: column;
        }

        .game-thumbnail {
            background-color: #0099ff;
            height: 140px;
            border-bottom: 4px solid #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fake-blocks {
            width: 120px;
            height: 60px;
            background-color: #7f7f7f;
            border: 2px solid #555;
        }

        .game-footer {
            background-color: #ffffff;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-title {
            font-weight: bold;
            font-size: 15px;
        }

        .play-btn {
            background-color: #28a745;
            color: #ffffff;
            padding: 8px 16px;
            border: 2px solid #000;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .play-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <!-- Barra de cima (estica até a esquerda cobrindo o topo) -->
    <div class="top-bar">
        Home
    </div>

    <div class="container">
        <!-- Barra lateral cinza logo abaixo -->
        <div class="sidebar">
            <div class="avatar"></div>
            <a href="#" class="home-btn">home</a>
        </div>

        <!-- Conteúdo Principal -->
        <div class="content-area">
            <div class="banner-box">
                blockster whoa
            </div>

            <div class="game-card">
                <div class="game-thumbnail">
                    <div class="fake-blocks"></div>
                </div>
                <div class="game-footer">
                    <span class="game-title">blockster test</span>
                    <a href="games/1/play.html" class="play-btn">Play</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
